<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Absensi QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        #reader {
            width: 300px;
            margin: auto;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 70%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        th {
            background: #eee;
        }
    </style>
</head>
<body>

<h2>ABSENSI SISWA</h2>

<div id="reader"></div>

<br>

<table>
    <thead>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Kehadiran</th>
        </tr>
    </thead>
    <tbody id="tabel"></tbody>
</table>

<script>
let no = 1;

function onScanSuccess(text) {
    try {
        const data = JSON.parse(text);

        document.getElementById("tabel").innerHTML += `
            <tr>
                <td>${no++}</td>
                <td>${data.nama}</td>
                <td>${data.kelas}</td>
                <td>Hadir</td>
            </tr>
        `;
    } catch {
        alert("QR Code tidak valid");
    }
}

new Html5Qrcode("reader").start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
);
</script>

</body>
</html>
